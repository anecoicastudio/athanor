<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 200" fill="none">
  <!-- Athanor — il varco. The gate slightly ajar, the Kairos spark in the opening. -->
  <!-- For moments of invitation: onboarding, «Hai un Momento», event tickets. -->
  <defs>
    <linearGradient id="mandala" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7D236E"/>
      <stop offset="35%" stop-color="#672088"/>
      <stop offset="70%" stop-color="#212088"/>
      <stop offset="100%" stop-color="#223D86"/>
    </linearGradient>
  </defs>
  <path d="M80 12 L82.6 22.4 L92 25 L82.6 27.6 L80 38 L77.4 27.6 L68 25 L77.4 22.4 Z" fill="#2BD0D2"/>
  <!-- Mandorla with the apex open — mandala gradient -->
  <path d="M90.8 36 A60 60 0 0 1 80 132 A60 60 0 0 1 69.2 36" stroke="url(#mandala)" stroke-width="2" stroke-linecap="round"/>
  <!-- The dream inside -->
  <circle cx="80" cy="78" r="3.5" fill="#2BD0D2"/>
</svg>
