packages:
  - "apps/*"
  - "packages/*"
allowBuilds:
  esbuild: true
  sharp: true
  unrs-resolver: true
overrides:
  lightningcss: 1.30.1
  # expo declares `@expo/metro-runtime: "*"`, so pnpm resolves to the highest
  # semver (56.0.15 = SDK 56), which lacks the `/error-overlay` subpath that
  # SDK 54's expo-router@6.x imports. Pin the SDK-54 line (6.x has error-overlay).
  "@expo/metro-runtime": 6.1.2
