packages:
  - 'apps/*'
  - 'packages/*'
allowBuilds:
  # sentry-cli binary — needed for Hermes source-map/symbol upload during the EAS
  # build (P1.4/P1.5). Runtime SDK doesn't need it; the build hook does.
  '@sentry/cli': true
  esbuild: true
  sharp: true
  unrs-resolver: true
  # workerd is the Workers runtime wrangler runs locally (`opennextjs-cloudflare
  # preview`). Its install script selects the platform binary; without approval
  # pnpm's dep-status check fails and every `opennextjs-cloudflare build` aborts
  # with "Command failed with exit code 1: pnpm install" — including in CI.
  workerd: true
# pnpm's release-age exemptions for SDK 57 packages published the same day they were
# installed (2026-09-09). Transient: sweep the list at the next SDK move, as the SDK 57
# upgrade did for the SDK 54 one.
minimumReleaseAgeExclude:
  - '@expo/cli@57.0.23'
  - '@expo/metro-file-map@57.0.3'
  - babel-preset-expo@57.0.11
  - expo-modules-core@57.0.17
  - expo-modules-jsi@57.1.0
  - expo@57.0.21
  - '@expo/ui@57.0.17'
  - expo-calendar@57.0.3
  - expo-glass-effect@57.0.2
  - expo-router@57.0.20
overrides:
  lightningcss: 1.30.1
