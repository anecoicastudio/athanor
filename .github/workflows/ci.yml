name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  node:
    name: lint · typecheck · test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo lint typecheck test

  db:
    name: migrations · pgTAP · types in sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.106.0
      - run: supabase start
      - run: supabase test db
      - name: generated types cover the schema
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          # CLI 2.x gen types requires a platform token even for --local.
          # Add the SUPABASE_ACCESS_TOKEN repo secret to activate this gate.
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::notice::types-sync gate skipped — set SUPABASE_ACCESS_TOKEN repo secret to enable"
            exit 0
          fi
          # The committed database.types.ts is regenerated via the Supabase MCP (hosted) per the
          # project's no-Docker workflow, which formats differently from `gen types --local` — a byte
          # diff can never match. Instead assert every DB object (table/view/function) in the local
          # migrations schema is present in the committed types: this catches "added a migration but
          # forgot to regenerate types". Formatting diffs are tolerated; column-level drift is caught
          # by the node job's typecheck (code using a missing/changed column fails to compile).
          supabase gen types --lang typescript --local > /tmp/gen.ts
          missing=0
          for name in $(grep -oE '^      [A-Za-z0-9_]+: \{$' /tmp/gen.ts | tr -d ' :{' | sort -u); do
            grep -qE "[[:space:]]$name: \{" packages/api/src/database.types.ts \
              || { echo "::error::'$name' is in the schema but missing from packages/api/src/database.types.ts — run pnpm gen:types and commit"; missing=1; }
          done
          [ "$missing" = 0 ] || exit 1
          echo "::notice::types-sync OK — every generated DB object is present in the committed types"
