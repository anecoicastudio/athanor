name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  node:
    name: lint · typecheck · test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo lint typecheck test
      - run: pnpm i18n:check

  e2e:
    name: web e2e (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: e2e admin smoke
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        run: |
          # The two admin smoke tests need only the Next dev server (Playwright webServer
          # starts `pnpm dev`) + the public Supabase URL/anon key for the SSR client.
          # Skip gracefully until the two repo secrets exist (same pattern as the types gate).
          if [ -z "$NEXT_PUBLIC_SUPABASE_URL" ] || [ -z "$NEXT_PUBLIC_SUPABASE_ANON_KEY" ]; then
            echo "::notice::e2e skipped — set NEXT_PUBLIC_SUPABASE_URL + NEXT_PUBLIC_SUPABASE_ANON_KEY repo secrets to enable"
            exit 0
          fi
          pnpm --filter web exec playwright install --with-deps chromium
          pnpm --filter web test:e2e

  db:
    name: migrations · pgTAP · types in sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.106.0
      - run: supabase start
      - run: supabase test db
      - name: generated types cover the schema
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          # CLI 2.x gen types requires a platform token even for --local.
          # Add the SUPABASE_ACCESS_TOKEN repo secret to activate this gate.
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::notice::types-sync gate skipped — set SUPABASE_ACCESS_TOKEN repo secret to enable"
            exit 0
          fi
          # The committed database.types.ts is regenerated via the Supabase MCP (hosted) per the
          # project's no-Docker workflow, which formats differently from `gen types --local` — a byte
          # diff can never match. Instead assert every DB object (table/view/function) in the local
          # migrations schema is present in the committed types: this catches "added a migration but
          # forgot to regenerate types". Formatting diffs are tolerated; column-level drift is caught
          # by the node job's typecheck (code using a missing/changed column fails to compile).
          supabase gen types --lang typescript --local > /tmp/gen.ts
          # Extract the public-schema TABLE names only (the real staleness signal). Other schemas
          # (e.g. graphql_public) and views/functions can legitimately differ in shape between the CLI
          # and the MCP generator, so we don't compare them here.
          awk '
            /^  public: \{/ {p=1}
            p && /^    Tables: \{/ {t=1; next}
            p && /^    (Views|Functions|Enums|CompositeTypes): \{/ {t=0}
            p && /^  [A-Za-z0-9_]+: \{/ && $0 !~ /^  public:/ {p=0; t=0}
            t && /^      [A-Za-z0-9_]+: \{$/ {gsub(/[ :{]/,""); print}
          ' /tmp/gen.ts | sort -u > /tmp/public_tables.txt
          missing=0
          while read -r name; do
            [ -n "$name" ] || continue
            grep -qE "[[:space:]]$name: \{" packages/api/src/database.types.ts \
              || { echo "::error::public table '$name' is in the schema but missing from packages/api/src/database.types.ts — run pnpm gen:types and commit"; missing=1; }
          done < /tmp/public_tables.txt
          [ "$missing" = 0 ] || exit 1
          echo "::notice::types-sync OK — all $(wc -l < /tmp/public_tables.txt | tr -d ' ') public tables present in the committed types"
