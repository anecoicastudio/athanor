name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

jobs:
  node:
    name: lint · typecheck · test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Persist turbo's local cache across runs. Sound to trust since turbo.json wires
      # cross-package edges through the `transit` node, and the two mirror tests that
      # read files outside every package (supabase/config.toml, apps/native/app.json)
      # declare them as $TURBO_ROOT$ inputs in their packages' turbo.json. PR branches
      # restore from the base branch's cache (GitHub cache scoping), so an untouched
      # package never re-runs.
      - uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-
      - run: pnpm turbo run lint typecheck test --cache-dir=.turbo
      - run: pnpm i18n:check
      - run: pnpm format:check

  e2e:
    name: web e2e (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Chromium is a ~150MB download per run; cache Playwright's browser store.
      # `playwright install` below still runs (it apt-installs system deps) but skips
      # the download when the store already holds the pinned build.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: playwright-${{ runner.os }}-
      - name: e2e admin smoke
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        run: |
          # The two admin smoke tests need only the Next dev server (Playwright webServer
          # starts `pnpm dev`) + the public Supabase URL and one API key for the SSR client
          # (publishable preferred, legacy anon accepted while it still exists).
          # Fail-loud policy (same as the db job's types gate): missing secrets soft-skip
          # on PRs and feature branches (forks have no secrets) but FAIL on a main push.
          # `deploy` has `needs: e2e`, and a step-level `exit 0` concludes the job
          # `success` — a quiet skip on main would let deploy read "never ran" as
          # "passed" (#146).
          if [ -z "$NEXT_PUBLIC_SUPABASE_URL" ] || { [ -z "$NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY" ] && [ -z "$NEXT_PUBLIC_SUPABASE_ANON_KEY" ]; }; then
            echo "::warning::e2e SKIPPED — set NEXT_PUBLIC_SUPABASE_URL + a key secret (NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY preferred, NEXT_PUBLIC_SUPABASE_ANON_KEY legacy) to enable"
            if [ "${{ github.ref }}" = "refs/heads/main" ]; then
              echo "::error::e2e gate cannot run on a main push without the Supabase e2e secrets"
              exit 1
            fi
            exit 0
          fi
          pnpm --filter web exec playwright install --with-deps chromium
          pnpm --filter web test:e2e

  edge:
    name: edge functions (deno test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      # Run from supabase/functions so its deno.json (nodeModulesDir: none) applies —
      # from the repo root, Deno finds package.json and expects npm deps in node_modules.
      # --allow-env: _shared/keys.ts reads the injected SUPABASE_* key variables.
      # --allow-read: _shared/config-invariants.test.ts parses config.toml and the function
      # sources to assert every function's verify_jwt posture matches its in-handler gate.
      - run: deno test --allow-env --allow-read .
        working-directory: supabase/functions

  bundle-leak:
    name: native bundle (expo export) · leak scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: export the JS bundle
        working-directory: apps/native
        # Double duty (#147): this export IS CI's native-bundle gate. A bad expo dep or
        # a Metro resolver break fails this job on every push and PR — there is no other
        # place apps/native gets bundled before EAS. JS bundling only: config-plugin
        # execution and native project generation live in `native-prebuild` (#350);
        # native compile/link (Xcode/Gradle) is still uncovered anywhere in CI.
        #
        # Metro inlines EXPO_PUBLIC_* at bundle time. None are set in this job ON PURPOSE:
        # the export must never need a secret, and whatever Metro inlines from the
        # environment is exactly what the grep below is hunting for.
        #
        # --no-bytecode: Hermes packs its string table with no separators, so the legitimate
        # 'sb_secret_' prefix literal in the client-side key guard (packages/api/src/
        # supabase-key.ts rejects secret keys by that prefix) abuts whatever string follows
        # and reads as key material. Plain JS keeps quotes, so the guard literal and a real
        # leaked key stay distinguishable.
        run: pnpm exec expo export --platform ios --platform android --no-bytecode --output-dir dist-ci
      - name: grep the emitted bundle for secret material
        working-directory: apps/native
        run: |
          # README rule 10's promise, built (issue #271, was #59): the manual release check
          # R-1 (docs/RELEASE-RUNBOOK.md — unzip the EAS build, grep the JS) run mechanically
          # on every push. This catches the realistic mistake — a service key or secret-shaped
          # env var inlined into the bundle — at PR time instead of at release. R-1 stays as
          # the belt-and-braces check on the real EAS artifact. One pattern is tightened vs
          # R-1: sb_secret_ requires 16+ key-shaped chars after the prefix, because the bare
          # prefix is a legitimate literal in the key guard (see the export step). Bundles
          # only, not sourcemaps: maps embed node_modules sources, which may name env vars
          # without shipping them. Mutation-tested: an injected sb_secret_… literal in
          # _layout.tsx survives minification and trips the grep.
          count=$(find dist-ci -type f -name '*.js' | wc -l | tr -d ' ')
          if [ "$count" -eq 0 ]; then
            echo "::error::expo export produced no JS bundle — the leak scan scanned nothing"
            exit 1
          fi
          if find dist-ci -type f -name '*.js' -print0 \
            | xargs -0 grep -laiE 'service_role|sb_secret_[A-Za-z0-9]{16}|sentry_dsn|sk_live'; then
            echo "::error::secret material in the exported bundle (service_role / sb_secret_… / sentry_dsn / sk_live) — see matching files above"
            exit 1
          fi
          echo "::notice::bundle-leak scan OK — $count bundle files clean"

  native-prebuild:
    name: native prebuild (expo) · doctor
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The other native half (#350): bundle-leak exports the JS, but a native module
      # that type-checks and bundles yet fails to configure/link would still reach EAS
      # unverified. These two steps close the cheap part of that gap. What they prove,
      # exactly (#146 — a gate must not look stronger than it is):
      #
      #   expo-doctor    — dependency/SDK coherence: package versions match the SDK's
      #                    expectations, config is sane. Talks to the Expo/npm APIs, so
      #                    a new SDK patch can turn it red with no repo change — that is
      #                    its canary function, same as running it locally after a dep
      #                    change (the rules/mobile.md ritual, now pinned as a devDep).
      #   expo prebuild  — config plugins all execute and the native projects generate
      #                    (AndroidManifest.xml, Podfile, xcodeproj). A crashing plugin
      #                    or invalid app.json fails here instead of on the EAS builder.
      #
      # Neither step COMPILES anything: no Gradle, no Xcode, no dependency linking.
      # Native compile/link remains EAS-verified only. The Android Gradle-assemble
      # canary (#350 rung 3) is deliberately not added: it needs JDK + Android SDK
      # setup and a multi-GB Gradle cache for 10×+ wall-time, and this repo has no
      # custom native code for it to uniquely catch — managed workflow, no android/
      # or ios/ committed, every app.json plugin a third-party npm package. Revisit
      # when a local config plugin or custom native module lands.
      #
      # Order matters: doctor runs BEFORE prebuild, because doctor flags generated
      # android//ios/ dirs as a non-CNG project and would fail on prebuild's output.
      # Both are non-interactive under CI=true (verified headless 2026-08-14).
      - name: expo-doctor — dependency/SDK coherence
        working-directory: apps/native
        run: pnpm exec expo-doctor
      - name: expo prebuild — config plugins + native project generation
        working-directory: apps/native
        # --no-install: skip pod/npm install — generation is the gate, not the toolchain.
        # Prebuild rewrites package.json scripts (start → run:*) in the runner checkout;
        # throwaway, nothing later in this job reads it.
        run: pnpm exec expo prebuild --no-install

  web-build:
    name: web build (OpenNext)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: build what deploy ships
        working-directory: apps/web
        env:
          # Next inlines NEXT_PUBLIC_* at build time, so the build needs the same env
          # the deploy job passes — same names, same source.
          NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_CF_BEACON_TOKEN: ${{ secrets.NEXT_PUBLIC_CF_BEACON_TOKEN }}
        run: |
          # apps/web otherwise builds only inside `deploy`, which is main-push only — a
          # PR could go green while unbuildable, and the break would first surface on the
          # release push (#147). This runs the exact command deploy runs
          # (`opennextjs-cloudflare build` wraps `next build`; no turbo build — the
          # @athanor/* packages ship raw TS compiled by Next via transpilePackages), so
          # PR-green means deploy-buildable. Exit status is the whole value: no artifact
          # is kept, deploy still builds its own.
          # Same fail-loud shape as the e2e and types gates: quiet skip without secrets
          # on PRs (forks have none), loud fail on a main push.
          if [ -z "$NEXT_PUBLIC_SUPABASE_URL" ] || { [ -z "$NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY" ] && [ -z "$NEXT_PUBLIC_SUPABASE_ANON_KEY" ]; }; then
            echo "::warning::web build SKIPPED — set NEXT_PUBLIC_SUPABASE_URL + a key secret (NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY preferred, NEXT_PUBLIC_SUPABASE_ANON_KEY legacy) to enable"
            if [ "${{ github.ref }}" = "refs/heads/main" ]; then
              echo "::error::web build gate cannot run on a main push without the Supabase secrets"
              exit 1
            fi
            exit 0
          fi
          pnpm exec opennextjs-cloudflare build

  db:
    name: migrations · pgTAP · types in sync
    runs-on: ubuntu-latest
    # The default workflow token is write-scoped org-wide; the pinned third-party
    # filter action below only ever needs to read the PR's changed files.
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
      # PR wall-time trim: this job spins up a full Postgres stack (~3 min) to replay
      # migrations, so on PRs it runs only when something DB-shaped changed. Pushes to
      # dev/main always run everything — the mainline gate never thins, so staging
      # drift an untouched-DB PR would miss surfaces on the next dev push at latest.
      #
      # The skip conditions are FAIL-CLOSED (`!= 'false'`, not `== 'true'`): if the
      # filter step is skipped (push events), renamed, or broken, its output is empty
      # and the job runs in full. They sit on each step rather than on the job because
      # `deploy` has `needs: [db]` — a skipped JOB would skip the release deploy,
      # skipped steps keep the job green. A step added below without the `if` runs
      # against a stack that was never started: copy the condition.
      - uses: dorny/paths-filter@de90cc6fb38fc0963ad72b210f1f284cd68cea36 # v3.0.2
        id: db-paths
        if: github.event_name == 'pull_request'
        with:
          filters: |
            db:
              - 'supabase/**'
              - 'packages/schemas/**'
              - 'packages/api/src/database.types.ts'
              # The job must test itself: a PR that only edits this workflow (CLI
              # version, the types-sync script, a new step) would otherwise skip the
              # gate it changes and first run it on the dev push. Same reason
              # mutation.yml lists itself in its own paths.
              - '.github/workflows/ci.yml'
      - uses: supabase/setup-cli@v1
        if: steps.db-paths.outputs.db != 'false'
        with:
          version: 2.106.0
      - run: supabase start
        if: steps.db-paths.outputs.db != 'false'
      - run: supabase test db
        if: steps.db-paths.outputs.db != 'false'
      - name: generated types cover the schema
        if: steps.db-paths.outputs.db != 'false'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          # CLI 2.x gen types requires a platform token even for --local.
          # Add the SUPABASE_ACCESS_TOKEN repo secret to activate this gate.
          # Fail-loud policy: a missing token soft-skips on PRs (forks have no
          # secrets) but FAILS on pushes to main — the gate silently rotting on
          # the mainline is how types drift ships.
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::warning::types-sync gate SKIPPED — set SUPABASE_ACCESS_TOKEN repo secret to enable"
            if [ "${{ github.ref }}" = "refs/heads/main" ]; then
              echo "::error::types-sync gate cannot run on main push without SUPABASE_ACCESS_TOKEN"
              exit 1
            fi
            exit 0
          fi
          # The committed database.types.ts is regenerated via the Supabase MCP (hosted) per the
          # project's no-Docker workflow, which formats differently from `gen types --local` — a byte
          # diff can never match. Instead assert every DB object (table/view/function) in the local
          # migrations schema is present in the committed types: this catches "added a migration but
          # forgot to regenerate types". Formatting diffs are tolerated; column-level drift is caught
          # by the node job's typecheck (code using a missing/changed column fails to compile).
          # gen types pulls public.ecr.aws/supabase/postgres-meta; shared runner IPs hit the
          # unauthenticated ECR rate limit ("docker: toomanyrequests") in bursts — retry with
          # backoff instead of failing the gate on infra weather (3 consecutive hits 2026-07-07).
          for attempt in 1 2 3 4 5; do
            supabase gen types --lang typescript --local > /tmp/gen.ts && break
            if [ "$attempt" = 5 ]; then
              echo "::error::supabase gen types failed after 5 attempts (ECR rate limit?)"
              exit 1
            fi
            echo "::warning::gen types attempt $attempt failed — retrying in $((attempt * 60))s"
            sleep $((attempt * 60))
          done
          # Extract the public-schema TABLE names only (the real staleness signal). Other schemas
          # (e.g. graphql_public) and views/functions can legitimately differ in shape between the CLI
          # and the MCP generator, so we don't compare them here.
          awk '
            /^  public: \{/ {p=1}
            p && /^    Tables: \{/ {t=1; next}
            p && /^    (Views|Functions|Enums|CompositeTypes): \{/ {t=0}
            p && /^  [A-Za-z0-9_]+: \{/ && $0 !~ /^  public:/ {p=0; t=0}
            t && /^      [A-Za-z0-9_]+: \{$/ {gsub(/[ :{]/,""); print}
          ' /tmp/gen.ts | sort -u > /tmp/public_tables.txt
          missing=0
          while read -r name; do
            [ -n "$name" ] || continue
            grep -qE "[[:space:]]$name: \{" packages/api/src/database.types.ts \
              || { echo "::error::public table '$name' is in the schema but missing from packages/api/src/database.types.ts — run pnpm gen:types and commit"; missing=1; }
          done < /tmp/public_tables.txt
          [ "$missing" = 0 ] || exit 1
          echo "::notice::types-sync OK — all $(wc -l < /tmp/public_tables.txt | tr -d ' ') public tables present in the committed types"

  deploy:
    name: deploy web (Cloudflare Workers)
    # Every gate first. Workers Builds (Cloudflare's own git integration) cannot
    # express this, which is why the deploy lives here: it would fire on push while
    # pgTAP and the types gate were still running, or already red.
    needs: [node, e2e, edge, db, bundle-leak, native-prebuild, web-build]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: build + deploy
        working-directory: apps/web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Next inlines NEXT_PUBLIC_* at build time, so these must exist HERE, not
          # as Worker runtime secrets. There are no runtime secrets: the waitlist
          # route talks to Supabase with the publishable key only.
          NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          # Read by app/layout.tsx to mount the Cloudflare Web Analytics beacon.
          # Optional: unset simply means no beacon.
          NEXT_PUBLIC_CF_BEACON_TOKEN: ${{ secrets.NEXT_PUBLIC_CF_BEACON_TOKEN }}
        run: |
          # This job only ever runs on a main push (job-level `if:` above), so unlike the
          # e2e and types gates there is no feature-branch case to stay quiet for: a soft
          # skip here is a release that "passes" while shipping nothing, silently, every
          # time. The Cloudflare account is provisioned (Worker, KV namespace, API token
          # — live since the 2026-08 Vercel→Workers migration), so the one-time
          # bootstrap rationale for skipping is gone. Fail loud (#146).
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::deploy cannot run — set CLOUDFLARE_API_TOKEN + CLOUDFLARE_ACCOUNT_ID repo secrets"
            exit 1
          fi
          # The KV id is account-specific and cannot be committed ahead of time. Catch the
          # placeholder here, where the message is actionable, rather than as an opaque
          # wrangler API error three minutes into a deploy.
          if grep -q REPLACE_WITH_KV_NAMESPACE_ID wrangler.jsonc; then
            echo "::error::wrangler.jsonc still holds the placeholder KV namespace id — run 'pnpm exec wrangler kv namespace create NEXT_INC_CACHE_KV' and commit the id"
            exit 1
          fi
          # No turbo build first: the @athanor/* packages ship raw TS and are compiled
          # by Next via transpilePackages, so `opennextjs-cloudflare build` (which runs
          # `next build` itself) is the only build there is.
          pnpm exec opennextjs-cloudflare build
          pnpm exec opennextjs-cloudflare deploy
