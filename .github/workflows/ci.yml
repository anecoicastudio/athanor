name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  node:
    name: lint · typecheck · test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo lint typecheck test

  db:
    name: migrations · pgTAP · types in sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.106.0
      - run: supabase start
      - run: supabase test db
      - name: generated types are committed
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          # CLI 2.x gen types requires a platform token even for --local.
          # Add the SUPABASE_ACCESS_TOKEN repo secret to activate this gate.
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::notice::types-sync gate skipped — set SUPABASE_ACCESS_TOKEN repo secret to enable"
            exit 0
          fi
          supabase gen types --lang typescript --local > /tmp/database.types.ts
          diff /tmp/database.types.ts packages/api/src/database.types.ts \
            || { echo '::error::database.types.ts is stale — run pnpm gen:types and commit'; exit 1; }
