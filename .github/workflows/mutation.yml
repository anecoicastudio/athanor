name: Mutation

# Separate workflow rather than a job in ci.yml so it can carry a `paths` filter: Stryker
# re-runs the suite once per surviving mutant (~90s for packages/core today), and there is no
# reason to pay that on a PR that only touches the app or the docs.
#
# Scoped to packages/core on purpose. It is pure TS with no I/O (core.md), so mutants are
# deterministic and fast, and it holds the Aura invariant — the highest-stakes logic in the
# repo. The first run at 90.59% surfaced four real gaps this gate now protects, including
# CREDITABLE_TYPES entries that could be blanked with no test failing.
on:
  push:
    branches: [main, dev]
    paths:
      - 'packages/core/**'
      - 'packages/schemas/**'
      - '.github/workflows/mutation.yml'
  pull_request:
    paths:
      - 'packages/core/**'
      - 'packages/schemas/**'
      - '.github/workflows/mutation.yml'

jobs:
  core:
    name: packages/core mutation score
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The score threshold lives in packages/core/stryker.config.json (`break`), so it
      # ratchets in the same file as the run config rather than drifting here.
      - run: pnpm --filter @athanor/core mutation
      - name: upload mutation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutation-report-core
          path: packages/core/reports/mutation/
          retention-days: 14
